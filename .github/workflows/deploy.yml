name: deploy

# Static site: publish the repo contents to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude README.md ./ _site/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
